    - heading "8.1 美国AI芯片出口管制政策的重构" [level=2] [ref=e25]
    - paragraph [ref=e26]:
      - text: 2026年1月，美国商务部正式发布了全新修订的管制法规，大幅放宽了此前极为严苛的算力禁运红线，正式允许美国芯片公司恢复向中国市场出口部分高端AI加速芯片（如NVIDIA H200、AMD MI308等）
      - generic [ref=e27]: "[17]"
      - text: 。
    - paragraph [ref=e28]:
      - text: 新版法规将TPP豁免门槛放宽至低于21,000区间，内存带宽上限松绑至低于6,500 GB/s——这使得允许出口芯片的处理性能跃升至此前"合规特供版降级芯片"的约13倍。然而，这绝非单纯的制裁放松，而是一场基于国家级"收益抽水分享（Revenue-sharing）"的强硬交易
      - generic [ref=e29]: "[17]"

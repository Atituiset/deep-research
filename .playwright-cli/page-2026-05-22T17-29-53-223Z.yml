    - heading "第一章：行业宏观图景与范式转移" [level=1] [ref=e26]
    - heading "1.1 AI计算进入异构时代" [level=2] [ref=e27]
    - paragraph [ref=e28]:
      - text: 截至2026年，全球人工智能计算硬件产业已正式迈入"多模态（Multimodal）"与"智能体（Agentic AI）"双轮驱动的异构计算时代。随着万亿参数规模大语言模型的常态化以及具身智能在物理世界的广泛部署，传统的冯·诺依曼架构在"存储墙"与"功耗墙"面前已遭遇难以逾越的物理瓶颈。单纯依靠晶体管物理尺寸的微缩（如向1.4nm节点的极限推进）已无法满足以指数级增长的系统级算力需求
      - generic [ref=e29]: "[1][2][3]"
      - text: 。
    - paragraph [ref=e30]: 当前的行业核心趋势表明，计算芯片的竞争已从单一的逻辑计算单元的频率与密度比拼，全面升级为系统级协同设计的综合博弈。云端数据中心正在演变为一台具有高度凝聚力的"超级计算机"，而在这个宏大的进程中，底层计算单元的形态发生了前所未有的显著分化。
    - generic [ref=e32]: 2026 AI 计算生态版图
    - heading "1.2 三大计算阵营的分化" [level=2] [ref=e34]
    - paragraph [ref=e35]:
      - text: 以
      - generic [ref=e36]: NVIDIA
      - text: 为代表的通用GPU阵营继续深化极度并行的SIMT架构，试图以无与伦比的互连带宽维持统治地位
      - generic [ref=e37]: "[5][6][7]"
      - text: ；以
      - generic [ref=e38]: Google
      - text: 为代表的云厂商自研TPU在脉动阵列道路上实现了训练与推理的架构硬分化
      - generic [ref=e39]: "[3][8]"
      - text: ；而专用神经处理单元（NPU）则在
      - generic [ref=e40]: Apple
      - text: 、
      - generic [ref=e41]: 高通
      - text: 与
      - generic [ref=e42]: 特斯拉
      - text: 等巨头的推动下，凭借空间计算架构确立了端侧高能效比的霸主地位
      - generic [ref=e43]: "[7][9][10]"
      - text: 。
    - generic [ref=e45]: 三大架构阵营核心指标对比
    - heading "1.3 制造工艺的范式转移" [level=2] [ref=e47]
    - paragraph [ref=e48]:
      - text: 芯片制造与封装工艺正在经历一场深刻的范式转移。先进封装技术取代了传统的单芯片光刻，构建起超越物理光罩极限的"封装堡垒"
      - generic [ref=e49]: "[11][12]"
      - text: ；微缩放格式（MX）与超低精度（如FP4）数据类型的标准化，正在从数据结构的数学底层重构AI模型的软硬件生态
      - generic [ref=e50]: "[13][14]"
      - text: 。而在复杂的全球地缘政治博弈与出口管制的深刻影响下，全球AI算力供应链正在形成以技术制裁、关税壁垒与国产化突围为特征的平行体系
      - generic [ref=e51]: "[15][16]"
      - text: 。

    - generic [ref=e27]: China Domestic AI Chip Vendor Panorama
    - paragraph [ref=e29]:
      - text: "Domestic AI chip vendors can be divided into three camps by technical approach:"
      - generic [ref=e30]: (Kunlunxin XPU, Huawei Da Vinci, Cambricon MLU),
      - generic [ref=e31]: (Biren, Moore Threads, Iluvatar, Muxi) and
      - generic [ref=e32]: "(Hygon DCU based on AMD license, Enflame focused on inference). Each path has tradeoffs: proprietary architectures control the stack but lack ecosystem, GPU compatibles leverage CUDA but face export controls, special routes scale fast but hit ceilings."

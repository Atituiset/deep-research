    - 'heading "Chapter 8: China Domestic AI Chip Ecosystem" [level=1] [ref=e23]'
    - paragraph [ref=e24]: Under escalating US AI chip export controls, China's AI chip industry has been forced into an unprecedented autonomous breakthrough battle. From Baidu Kunlunxin to Huawei Ascend, from Cambricon to Biren Technology, a full-stack domestic substitution path from architecture to software ecosystem is being paved with difficulty and determination. This chapter deeply analyzes the nine most representative vendors and their core products.

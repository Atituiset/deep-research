    - heading "MI300X 核心技术特征" [level=3] [ref=e90]
    - list [ref=e91]:
      - listitem [ref=e92]:
        - strong [ref=e93]: 8× CDNA3计算芯粒
        - text: (5nm)：每芯粒38个Compute Unit，总计304 CU / 19,456个流处理器
      - listitem [ref=e94]:
        - strong [ref=e95]: 4× IOD
        - text: (6nm)：Infinity Fabric互联 + 内存控制器
      - listitem [ref=e96]:
        - strong [ref=e97]: 1530亿晶体管
        - text: ：超过NVIDIA H100的800亿，体现Chiplet方案的面积优势
      - listitem [ref=e98]:
        - strong [ref=e99]: 192GB HBM3
        - text: ：8-Hi堆叠，5.3 TB/s带宽。大容量设计直接瞄准大模型推理的KV-Cache需求
      - listitem [ref=e100]:
        - strong [ref=e101]: 统一内存架构
        - text: ：CPU（EPYC）与GPU共享地址空间，消除显式的Host-to-Device数据搬运
    - heading "关键性能对比" [level=3] [ref=e102]
    - generic [ref=e104]: AMD Instinct vs NVIDIA H100/B200 关键参数
    - paragraph [ref=e106]:
      - text: MI300X的
      - strong [ref=e107]: 192GB HBM3
      - text: 使其在Llama-2 70B等大模型推理任务中显著优于H100（80GB）。由于无需模型分片到多卡，单卡即可容纳全量权重的KV-Cache，延迟降低40-60%，系统总拥有成本（TCO）优势明显。然而在训练场景，NVIDIA B200凭借FP4 9 PFLOPS的算力密度仍然保持绝对优势。
    - heading "11.2 ROCm 6.0：AMD的软件突围" [level=2] [ref=e108]
    - paragraph [ref=e109]: 如果说硬件是肌肉，软件生态就是神经系统。AMD深知CUDA的护城河有多深——400万+开发者，300+加速库，20年的持续投资。ROCm（Radeon Open Compute）是AMD的回应：
    - generic [ref=e110]:
      - heading "ROCm 6.0 关键技术栈" [level=3] [ref=e111]
      - list [ref=e112]:
        - listitem [ref=e113]:
          - strong [ref=e114]: HIP
          - text: "（Heterogeneous-compute Interface for Portability）：CUDA到ROCm的源代码翻译层。`hipify-perl` 工具可自动将90%+的CUDA代码转换为HIP代码"
        - listitem [ref=e115]:
          - strong [ref=e116]: ROCm Libraries
          - text: ：rocBLAS、rocFFT、MIOpen（对标cuDNN）、RCCL（对标NCCL），覆盖核心算子
        - listitem [ref=e117]:
          - strong [ref=e118]: PyTorch/TensorFlow原生支持
          - text: "：PyTorch 2.0+已内置ROCm后端，`torch.cuda` → `torch.rocm` 切换成本极低"
        - listitem [ref=e119]:
          - strong [ref=e120]: OpenAI Triton
          - text: ：AMD已贡献ROCm后端，使Triton编译的算子可直接在MI300X上运行
    - paragraph [ref=e121]: ROCm的年度迭代速度令人瞩目——从2020年仅支持几款工作站GPU，到2024年实现对MI300X的全栈优化，AMD在软件上的投入正以前所未有的速度加码。但客观而言，ROCm的算子覆盖度约为CUDA的60%，社区活跃度（GitHub Stars, Stack Overflow问题数）约为CUDA的8%，追赶之路仍然漫长。
    - heading "11.3 UALink：打破NVLink的封闭生态" [level=2] [ref=e122]
    - paragraph [ref=e123]:
      - text: 2024年5月，AMD联合Broadcom、Intel、Google、Microsoft、Meta、HPE和Cisco（随后加入）宣布成立
      - strong [ref=e124]: Ultra Accelerator Link (UALink) 联盟
      - text: 。这是对NVIDIA封闭式NVLink生态的正面挑战：
    - generic [ref=e126]: UALink联盟成员生态

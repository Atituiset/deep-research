    - paragraph [ref=e177]: AMD数据中心GPU营收预计从2023年的约$4B增长至2024年的$5B+，市占率从5%提升至约8%。但考虑到全球AI芯片市场本身正以>50% CAGR爆发式增长，AMD的绝对营收增长掩盖了其相对份额爬升缓慢的现实困境。

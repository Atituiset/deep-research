  - generic [ref=e25]:
    - heading "第十一章：AMD Instinct — NVIDIA之外的GPU巨头" [level=1] [ref=e26]
    - paragraph [ref=e27]: 在NVIDIA占据约80%数据中心GPU市场的阴影之下，AMD正以Instinct系列加速器展开一场持久的技术反击战。从CDNA架构的快速迭代到MI300X在部分推理场景中反超H100，再到牵头发起UALink联盟打破NVLink封闭生态——AMD正在构建一个从芯片架构到互联标准的全方位对抗体系。
    - heading "11.1 CDNA架构：从RDNA的分离到AI专用化" [level=2] [ref=e28]
    - paragraph [ref=e29]:
      - text: AMD在2020年做出了一个关键决策——将GPU架构分叉为游戏向的
      - strong [ref=e30]: RDNA
      - text: 和计算向的
      - strong [ref=e31]: CDNA
      - text: （Compute DNA）。这一决策使AMD能够为AI工作负载独立优化计算单元和内存系统，而不受图形渲染管线的历史包袱约束。
    - paragraph [ref=e32]: CDNA3（2023年发布，搭载于MI300X）是该架构的第三次重大迭代：
    - generic [ref=e34]: MI300X Chiplet架构示意图

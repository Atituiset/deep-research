      - paragraph [ref=e204]:
        - text: 壁仞科技2019年成立于上海，是国内首个采用Chiplet架构设计大算力GPU芯片的厂商。其核心产品壁砺™系列采用OAM标准模组设计，兼容现有GPU服务器基础设施

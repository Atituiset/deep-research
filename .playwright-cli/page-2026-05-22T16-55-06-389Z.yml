  - generic [ref=e16]:
    - heading "第八章：中国国产AI芯片生态全景" [level=1] [ref=e17]
    - paragraph [ref=e18]: 在美国持续升级的AI芯片出口管制下，中国AI芯片产业被迫进入了一场史无前例的自主化突围战。从百度昆仑芯到华为昇腾，从寒武纪到壁仞科技，一条从底层架构到软件生态的全栈国产替代路径正在艰难而坚定地铺开。本章将深度剖析这一生态中最具代表性的九大厂商及其核心产品。
    - heading "8.1 产业全景：九大国产AI芯片厂商矩阵" [level=2] [ref=e19]
    - generic [ref=e21]: 中国国产AI芯片厂商全景定位图
    - paragraph [ref=e23]:
      - text: 当前国产AI芯片厂商可按技术路线分为三大阵营：
      - generic [ref=e24]: 自研架构派
      - text: （昆仑芯XPU、华为Da Vinci、寒武纪MLU）、
      - generic [ref=e25]: GPU兼容派
      - text: （壁仞、摩尔线程、天数智芯、沐曦）和
      - generic [ref=e26]: 特殊路线派
      - text: （海光DCU基于AMD授权、燧原专注推理）。每条路线各有取舍：自研架构掌控底层但生态弱，GPU兼容借用CUDA生态但受制于出口管制，特殊路线起量快但天花板低。
    - generic [ref=e28]: 国产AI芯片关键参数对比矩阵
    - heading "8.2 昆仑芯科技（Kunlunxin）—— 百度系XPU架构的产业深耕" [level=2] [ref=e30]
    - generic [ref=e31]:
      - heading "起源与演进" [level=3] [ref=e32]
      - paragraph [ref=e33]:
        - text: 昆仑芯科技前身为百度智能芯片及架构部，自2011年启动FPGA AI加速器研发，经过超过14年的技术迭代，于2021年4月完成独立融资。公司拥有400余项发明专利申请（授权近百项），在ASPLOS 2014发表国际计算机系统顶级会议论文，4次登上Hot Chips舞台
        - generic [ref=e34]: "[昆仑芯官网]"
        - text: 。
      - generic [ref=e36]: 昆仑芯三代产品演进时间线
      - heading "核心架构：XPU-R" [level=3] [ref=e38]
      - paragraph [ref=e39]:
        - text: 昆仑芯2代AI芯片基于自研XPU-R架构，采用7nm制程，核心创新在于
        - strong [ref=e40]: 通用指令集与专用AI指令集融合
        - text: ——同一芯片既可执行通用计算任务（如数据预处理、逻辑控制），也可执行高强度张量运算，实现"训练+推理+虚拟化"三合一。这与NVIDIA的SIMT架构形成差异化：XPU-R没有CUDA那样庞大的通用软件生态，但在特定AI工作负载下具有更高的面积效率
        - generic [ref=e41]: "[昆仑芯官网]"
        - text: 。

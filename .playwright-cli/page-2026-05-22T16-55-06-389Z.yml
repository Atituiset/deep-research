      - heading "昆仑芯3代：大模型时代的进化" [level=3] [ref=e109]
      - paragraph [ref=e110]:
        - text: 2024年，昆仑芯3代实现量产，满足大模型时代AI系统更高要求。2025年落地32/64卡超节点产品，并发布256/512卡超节点技术，标志着昆仑芯从单卡芯片厂商向大规模集群方案提供商的战略跃迁
        - generic [ref=e111]: "[昆仑芯官网]"
        - text: 。
      - paragraph [ref=e112]: R480-X8加速器组严格遵循OCP-OAI设计标准，UBB基板搭载8个OAM模组，片间互联带宽200GB/s，可构建大规模并行计算集群。这种标准化设计使昆仑芯产品能够直接融入现有智算中心基础设施，降低客户切换成本。
      - heading "部署规模与客户生态" [level=3] [ref=e113]
      - paragraph [ref=e114]: 昆仑芯已深度参与中国电信智算测试与适配优化中心、中国移动供应链生态合作大会等国家级算力项目，参与发布超节点智算应用"北京方案"。百度内部大规模自用（搜索、文心大模型推理），外部客户覆盖互联网、智慧金融、智慧园区、智慧交通等场景。
    - heading "8.3 华为昇腾（Huawei Ascend）—— 制裁之下的国产算力旗舰" [level=2] [ref=e115]
    - generic [ref=e116]:
      - paragraph [ref=e117]: 华为昇腾系列是当前中国国产AI芯片中算力最强、部署规模最大的产品线。Ascend 910C采用双硅模片拼图封装架构（详见第九章地缘政治专题），由SMIC N+2（约7nm等效）制造，FP16峰值算力670-800 TFLOPS，约为NVIDIA H100的80%水平。2025-2026年规划年交付60万颗，是中国AI算力自主化战略的核心底座。
      - paragraph [ref=e118]: 昇腾生态（CANN软件栈+MindSpore框架）是国产AI芯片中软件生态最成熟的方案，但在CUDA兼容性和开发者社区规模上仍与NVIDIA存在数量级差距。
    - heading "8.4 寒武纪（Cambricon）—— 从学术创业到科创板上市" [level=2] [ref=e119]
    - generic [ref=e120]:
      - paragraph [ref=e121]:
        - text: 寒武纪由中科院计算所陈天石团队创立，2016年推出全球首款商用终端AI处理器寒武纪1A（搭载于华为麒麟970），后因华为自研Da Vinci架构而被迫转型云端。2020年科创板上市，当前主力产品为MLU370系列
        - generic [ref=e122]: "[寒武纪官网]"
        - text: 。

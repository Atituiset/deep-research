      - paragraph [ref=e201]: 天数智芯的核心优势在于其软件栈对CUDA的兼容层，可大幅降低从NVIDIA平台迁移的工程成本。但"兼容"本身就是双刃剑——既限制了架构层面的激进创新，也意味着在NVIDIA原生生态面前永远只能是"跟随者"。
    - heading "8.6 壁仞科技（Biren Technology）—— Chiplet先驱的突围之路" [level=2] [ref=e202]

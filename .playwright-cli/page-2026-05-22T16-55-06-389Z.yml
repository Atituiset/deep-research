      - paragraph [ref=e245]:
        - text: 壁仞科技的差异化亮点在于：
        - strong [ref=e246]: 光互连技术
        - text: ——国内首次实现GPU与OCS（光交换机）通信连接，并率先完成光互连技术商用落地。这在大规模集群互联场景中可能成为关键优势。其BIRENSUPA™软件平台构建了自主原创的软件开发体系。
      - paragraph [ref=e247]: 然而，壁仞科技早期旗舰产品BR100曾因台积电代工受限而遭遇重大挫折，被迫转向国内代工和降规格方案，这深刻体现了出口管制对国产GPU厂商的致命打击。
    - heading "8.7 摩尔线程（Moore Threads）—— 全功能GPU的本土化尝试" [level=2] [ref=e248]
    - paragraph [ref=e250]: 摩尔线程由前NVIDIA全球副总裁张建中创立，定位为"全功能GPU"厂商——既做AI计算，也做图形渲染和视频处理。其MTT S4000面向数据中心AI推理，MTT S3000面向图形与AI混合负载。摩尔线程的优势在于创始人深厚的GPU产业背景，劣势在于作为创业公司同时铺开AI+图形双线作战，资源分散风险极高。
    - heading "8.8 燧原科技（Enflame Technology）—— 推理赛道的专注者" [level=2] [ref=e251]
    - paragraph [ref=e253]: 燧原科技选择了一条差异化路线——专注AI推理市场，避开与NVIDIA和华为昇腾在训练领域的正面硬刚。其CloudBlade系列推理卡在互联网内容审核、推荐系统推理等场景中具有一定的性价比优势。但在大模型训练需求爆发的大背景下，"纯推理"定位的市场天花板受到质疑。
    - heading "8.9 海光信息（Hygon）—— x86授权路线的特殊存在" [level=2] [ref=e254]
    - paragraph [ref=e256]: 海光信息依托与AMD的技术授权协议，在x86 CPU（海光CPU）和DCU（协处理器，类似AMD Instinct MI系列）领域拥有独特的生态位。海光DCU可运行ROCm生态，在CUDA兼容性上天然优于其他国产方案。但这一路线的天花板也很明显：授权技术的迭代节奏完全受制于中美关系的风向，且无法获取AMD最新代际技术。
    - heading "8.10 沐曦科技（Muxi）—— GPU新势力的突围" [level=2] [ref=e257]
    - paragraph [ref=e259]: 沐曦科技成立于2020年，专注于高性能GPU芯片研发。公司核心团队拥有深厚的GPU架构设计背景，产品瞄准云端训练与推理市场。作为较晚入局的玩家，沐曦需要同时面对技术追赶和市场份额已被先发者占据的双重挑战，但其自研架构路线如果成功，将具有更高的长期竞争力天花板。
    - heading "8.11 国产芯片生态的核心困境与破局" [level=2] [ref=e260]
    - generic [ref=e262]: 国产AI芯片四大核心困境
    - paragraph [ref=e264]: 纵观九大国产AI芯片厂商，其面临的挑战可归纳为四大核心困境：
    - list [ref=e265]:
      - listitem [ref=e266]:
        - strong [ref=e267]: 制造代差困境
        - text: ：SMIC N+2（7nm等效）vs TSMC N3（3nm）——两代制程差距直接决定了晶体管密度、功耗和频率的天花板
      - listitem [ref=e268]:
        - strong [ref=e269]: 封装落后困境
        - text: ：无法获取TSMC CoWoS先进封装，Die-to-Die带宽差距10-20倍，HBM集成受限
      - listitem [ref=e270]:
        - strong [ref=e271]: 软件生态困境
        - text: ：CUDA拥有超400万开发者，国产方案（CANN/BIRENSUPA/天垓SDK）在框架兼容性、算子覆盖度和社区活跃度上差距巨大
      - listitem [ref=e272]:
        - strong [ref=e273]: 标准碎片困境
        - text: ：九大厂商九套架构，互不兼容——算力无法在异构集群中自由调度，与OCP/UEC国际标准化趋势背道而驰
    - generic [ref=e275]: 国产AI芯片 vs NVIDIA 旗舰性能代差概览
    - paragraph [ref=e277]: 然而，在出口管制的倒逼效应下，中国AI芯片产业正在经历一场从"可用"到"好用"的质变：华为昇腾910C以60万颗年交付规模撑起了国产训练算力的底线，昆仑芯凭借百度体系内的大规模实战打磨出了成熟的训推一体方案，壁仞的光互连技术则在大规模集群场景中开辟了差异化突破口。尽管与国际领先水平仍有显著差距，但这些厂商正在用"系统级工程补救"的方式，在物理极限的约束下逐步缩小差距。

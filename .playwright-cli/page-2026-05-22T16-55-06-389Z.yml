      - paragraph [ref=e168]: 寒武纪的挑战在于：从终端NPU转型云端加速器后，面临华为昇腾和百度昆仑芯的双重挤压，市场空间持续收窄。其独有的终端AI处理器基因在边缘侧仍有价值，但云端训练市场已被昇腾主导。
    - heading "8.5 天数智芯（Iluvatar CoreX）—— GPU兼容路线的先驱" [level=2] [ref=e169]
    - generic [ref=e170]:
      - paragraph [ref=e171]:
        - text: 天数智芯选择了一条"GPU架构兼容+国产制造"的路线，试图在保持CUDA生态兼容性的同时实现芯片国产化。其产品线分为两大系列
        - generic [ref=e172]: "[天数智芯官网]"
        - text: ：

name: Sync Reports to Tech-Blog

# 暂时禁用：等 Tech-Blog 展示方案确认后再恢复
# on:
#   push:
#     branches: [main]
#     paths:
#       - '**/*.html'
#       - '**/*.js'
#       - '**/*.css'
on: workflow_dispatch

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deep-research
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_PAT }}

      - name: Checkout Tech-Blog
        uses: actions/checkout@v4
        with:
          repository: Atituiset/Tech-Blog
          token: ${{ secrets.SYNC_PAT }}
          path: tech-blog

      - name: Sync HTML, JS and CSS reports
        run: |
          mkdir -p tech-blog/public/research
          # 寻找 html、js、css 文件并保持相对路径拷贝
          find . \( -name '*.html' -o -name '*.js' -o -name '*.css' \) -not -path './tech-blog/*' -not -path './.git/*' | while read file; do
            dir=$(dirname "$file")
            mkdir -p "tech-blog/public/research/$dir"
            cp "$file" "tech-blog/public/research/$file"
          done
          
          cd tech-blog
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add -A
          git commit -m 'sync: update research reports and assets from deep-research' || true
          git push

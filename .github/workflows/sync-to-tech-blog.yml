name: Sync Reports to Tech-Blog

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.js'
      - '**/*.css'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deep-research
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_PAT }}

      - name: Checkout Tech-Blog
        uses: actions/checkout@v4
        with:
          repository: Atituiset/Tech-Blog
          token: ${{ secrets.SYNC_PAT }}
          path: tech-blog

      - name: Sync HTML, JS and CSS reports
        run: |
          mkdir -p tech-blog/public/research
          # 寻找 html、js、css 文件并保持相对路径拷贝
          find . \( -name '*.html' -o -name '*.js' -o -name '*.css' \) -not -path './tech-blog/*' -not -path './.
git/*' | while read file; do
            git commit -m 'sync: update research reports and assets from deep-research'
            git push
          fi
